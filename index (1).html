  el.innerHTML=F.length?F.map(x=>`<div class="tk ${x.st}"><div class="op" style="border:0;padding:0"><b>#${x.no} · Miiska ${esc(x.tbl)}</b><span class="sb">${Math.max(0,Math.round((Date.now()-x.t)/60000))} daq kahor</span></div><div style="margin:6px 0">${esc(x.l).replace(/\n/g,'<br>')}</div><div class="op" style="border:0;padding:0"><b>${fmt(x.tot)}</b><span class="sb">${esc(x.pay)}</span></div>${x.st=='bixiyay'?'':`<button class="pri" data-st="${x.k}" data-n="${x.st=='cusub'?'diyaar':'bixiyay'}">${x.st=='cusub'?'Diyaarso':'La bixiyay'}</button>`}</div>`).join(''):'<p class="ce">Dalab ma jiro</p>'}
 catch(e){el.innerHTML='<p class="ce">Dalabaadka lama helin. Hubi URL-ka iyo rules-ka.</p>'}}
const ln=a=>(a||[]).map(o=>o.n+'='+o.p).join('\n');
function setg(){
 let h='<h1 class="c">⚙ Settings</h1><div class="tabs">'+['Guud','Qaybaha','Cuntada','Lacagta','Bixinta','Dalabaadka','QR & Kaydi'].map((x,i)=>`<button class="${S.tab==i?'on':''}" data-tab="${i}">${x}</button>`).join('')+'</div>';
 const A=(a,i,f,v,t='')=>`data-a="${a}" data-i="${i}" data-f="${f}" ${t} value="${esc(v)}"`;
 if(S.tab==0)h+=`<label class="f">Magaca</label><input ${A('g',0,'name',D.name)}><label class="f">Logo-ga hotelka</label><input type="file" accept="image/*" id="lgf"><label class="f">Lambarka cabashada</label><input ${A('g',0,'phone',D.phone)}><label class="f">WhatsApp-ka dalabka (tusaale 252907283347)</label><input ${A('g',0,'wa',D.wa)}><label class="f">Tirada miisaska</label><input type="number" ${A('g',0,'tb',D.tb)}><label class="f">PIN-ka settings</label><input ${A('g',0,'pin',D.pin)}>`;
 if(S.tab==1)h+=D.cats.map((c,i)=>`<div class="rw"><input class="e" ${A('cats',i,'e',c.e)}><input ${A('cats',i,'n',c.n)}><button data-del="cats" data-i="${i}">🗑</button></div>`).join('')+'<button class="pri" data-add="cats">+ Qayb cusub</button>';
 if(S.tab==2)h+='<p class="sb">Haddii noocyo jiraan, qiimaha nooc kasta ayaa la isticmaalaa.</p>'+D.items.map((m,i)=>`<details class="it"><summary>${m.e} ${esc(m.n)}</summary><div class="rw"><input class="e" ${A('items',i,'e',m.e)}><input ${A('items',i,'n',m.n)}></div><div class="rw"><select data-a="items" data-i="${i}" data-f="c">${D.cats.map(c=>`<option value="${c.id}"${c.id==m.c?' selected':''}>${esc(c.n)}</option>`).join('')}</select><input type="number" step="0.01" ${A('items',i,'p',m.p)}></div><label class="f">Noocyada (magac=qiime, mid sadar ah)</label><textarea rows="3" data-a="items" data-i="${i}" data-f="v">${esc(ln(m.v))}</textarea><label class="f">Dheeraad (magac=qiime)</label><textarea rows="3" data-a="items" data-i="${i}" data-f="x">${esc(ln(m.x))}</textarea><label class="f"><input type="checkbox" data-a="items" data-i="${i}" data-f="on"${m.on!==false?' checked':''}> Diyaar ah</label><button data-del="items" data-i="${i}">🗑 Tirtir</button></details>`).join('')+'<button class="pri" data-add="items">+ Cunto cusub</button>';
 if(S.tab==3)h+='<p class="sb">1 USD = imisa? Qiime kasta ku qor.</p>'+D.cur.map((c,i)=>`<div class="rw"><input ${A('cur',i,'c',c.c)}><input class="e" ${A('cur',i,'s',c.s)}><input type="number" ${A('cur',i,'r',c.r)}>${D.cur.length>1?`<button data-del="cur" data-i="${i}">🗑</button>`:''}</div>`).join('')+'<button class="pri" data-add="cur">+ Lacag cusub</button>';
 if(S.tab==4)h+='<p class="sb">Magaca iyo lambarka macmiilku ku bixinayo. Mid kasta waa la beddeli karaa.</p>'+D.pay.map((p,i)=>`<div class="rw"><input ${A('pay',i,'n',p.n)}><input inputmode="tel" placeholder="Lambarka" ${A('pay',i,'no',p.no)}><button data-del="pay" data-i="${i}">🗑</button></div>`).join('')+'<button class="pri" data-add="pay">+ Habka cusub</button>';
 if(S.tab==5)h+=`<p class="sb">Si dalabku shaashadda cashier-ka ugu soo baxo, waxaa loo baahan yahay Firebase Realtime Database (bilaash).</p><label class="f">Firebase Database URL</label><input placeholder="https://magaca-default-rtdb.firebaseio.com" ${A('g',0,'fb',D.fb)}><h3>Shaqaalaha (dalabaadka oo keliya arka)</h3>`+D.staff.map((s,i)=>`<div class="rw"><input ${A('staff',i,'n',s.n)}><input inputmode="numeric" placeholder="PIN" ${A('staff',i,'pin',s.pin)}><button data-del="staff" data-i="${i}">🗑</button></div>`).join('')+'<button class="pri" data-add="staff">+ Shaqaale cusub</button><p class="sb">Shaqaaluhu wuxuu taabanayaa ⚙ Maamul, wuxuuna galinayaa PIN-kiisa.</p>';
 if(S.tab==6)h+=`<p class="sb">QR-ku wuxuu u dhigmaa link-ga website-ka ee hadda furan. Marka hore website-ka host-garee, kaddibna halkan ka fur.</p><div id="qr"></div><p class="ce" style="word-break:break-all">${esc(location.href.split('#')[0])}</p><button class="pri" id="qd">Soo deg QR code</button><button class="pri" id="ex">Kaydi menu cusub (index.html)</button><p class="sb">Isbeddellada waxay ku kaydsan yihiin taleefankan. Si macmiilku u arko, kaydi faylka oo mar kale host-ga ku soo rar.</p><button class="pri" id="rs" style="background:#8b7565">Tirtir isbeddellada</button>`;
 sh(h,'full');
 if(S.tab==6){if(window.QRCode)new QRCode($('#qr'),{text:location.href.split('#')[0],width:220,height:220});else $('#qr').textContent='Internet ku xidh si QR u muuqdo'}}
const ex=()=>{save();let c=document.documentElement.cloneNode(true);c.querySelector('#dt').textContent=JSON.stringify(D).replace(/</g,'\\u003c');c.querySelectorAll('[data-dyn]').forEach(e=>e.innerHTML='');c.querySelector('#ov').classList.remove('show');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['<!doctype html>\n'+c.outerHTML],{type:'text/html'}));a.download='index.html';a.click()};
document.addEventListener('click',e=>{if(e.target.id=='ov'){hide();return}let t=e.target.closest('button,a');if(!t)return;let d=t.dataset,id=t.id;
 if(d.ci!==undefined){S.ci=+d.ci;try{localStorage.setItem('jpc',S.ci)}catch(x){}render()}
 else if(d.cat){S.cat=d.cat;render()}
 else if(d.it)item(d.it);
 else if(id=='ob')cart();
 else if(id=='cl'||id=='cl2')hide();
 else if(d.q!==undefined){let l=S.cart[d.q];l.q+=+d.d;if(l.q<1)S.cart.splice(d.q,1);bar();S.cart.length?cart():hide()}
 else if(id=='sd'){t.disabled=true;send()}
 else if(d.st){fetch(FB()+'/orders/'+d.st+'.json',{method:'PATCH',body:JSON.stringify({st:d.n})}).then(poll)}
 else if(d.cp){if(navigator.clipboard)navigator.clipboard.writeText(d.cp);t.textContent='✓ La koobiyeeyay'}
 else if(id=='gear'){let p=prompt('Gali PIN-ka settings');if(p!==null&&p===String(D.pin)){S.tab=0;setg()}else if(p&&D.staff.some(x=>x.pin===p))staff();else if(p!==null)alert('PIN khaldan')}
 else if(d.tab){S.tab=+d.tab;setg()}
 else if(d.del){D[d.del].splice(d.i,1);save();setg();render()}
 else if(d.add){let n={cats:{id:'c'+Date.now(),n:'Qayb cusub',e:'🍴'},items:{id:Date.now(),c:D.cats[0]?D.cats[0].id:'',e:'🍽️',n:'Cunto cusub',p:1},cur:{c:'ETB',s:'Br',r:120},pay:{n:'Habka cusub',no:''},staff:{n:'Shaqaale',pin:''}}[d.add];D[d.add].push(n);save();setg();render()}
 else if(id=='qd'){let c=$('#qr canvas');if(c){let a=document.createElement('a');a.href=c.toDataURL();a.download='qr-menu.png';a.click()}}
 else if(id=='ex')ex();
 else if(id=='rs'&&confirm('Tirtir isbeddellada oo dib u noqo asalka?')){localStorage.removeItem('jpd');location.reload()}});
document.addEventListener('change',e=>{let t=e.target;
 if(t.id=='tb')S.tbl=t.value;
 if(t.name=='py'){S.pay=t.value;$('#pn').innerHTML=payInfo()}
 if(t.name=='of'){S.of=t.value;poll()}
 if(t.id=='lgf'&&t.files[0]){let r=new FileReader;r.onload=()=>{let i=new Image;i.onload=()=>{let c=document.createElement('canvas'),s=Math.min(1,220/Math.max(i.width,i.height));c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);D.logo=c.toDataURL('image/png');save();render()};i.src=r.result};r.readAsDataURL(t.files[0])}
 let a=t.dataset.a;if(!a)return;let f=t.dataset.f,v=t.type=='checkbox'?t.checked:t.value;
 if(a=='g')D[f]=v;else{let o=D[a][t.dataset.i];
  if(f=='p'||f=='r')v=parseFloat(v)||0;
  if(f=='v'||f=='x')v=v.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{let[n,p]=l.split('=');return{n:n.trim(),p:parseFloat(p)||0}});
  o[f]=v}
 save();render()});
$('#q').oninput=e=>{S.q=e.target.value;render()};
document.addEventListener('keydown',e=>{if(e.key=='Escape')hide()});
render();
</script>
